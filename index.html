<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>英単語ライター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3b82f6; --primary-dk: #2563eb;
      --success: #10b981; --danger: #ef4444; --orange: #f97316;
      --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --text2: #64748b;
      --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06); --r: 12px;
    }
    html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    input, textarea { -webkit-user-select:text; user-select:text; }
    #app { display:flex; flex-direction:column; height:100dvh; }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:0 20px; flex-shrink:0; }
    .header-top { display:flex; align-items:center; justify-content:space-between; padding:10px 0 6px; }
    .app-title { font-size:20px; font-weight:800; }
    .tabs { display:flex; gap:2px; }
    .tab-btn { padding:8px 18px; border:none; background:transparent; border-bottom:3px solid transparent; font-size:14px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .2s; white-space:nowrap; }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
    #content { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .tab-panel { display:none; flex:1; min-height:0; flex-direction:column; overflow-y:auto; }
    .tab-panel.active { display:flex; }

    /* Buttons */
    .btn { padding:10px 18px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:filter .15s,background .15s; white-space:nowrap; }
    .btn:hover { filter:brightness(1.08); } .btn:active { filter:brightness(.95); }
    .btn-primary  { background:var(--primary);  color:#fff; }
    .btn-success  { background:var(--success);  color:#fff; }
    .btn-orange   { background:var(--orange);   color:#fff; }
    .btn-outline  { background:transparent; color:var(--text2); border:1px solid var(--border); }
    .btn-red-soft { background:#fee2e2; color:var(--danger); border:none; }
    .btn-grn-soft { background:#d1fae5; color:var(--success); border:none; }
    .btn-lg { padding:14px 28px; font-size:16px; border-radius:10px; min-width:140px; justify-content:center; }
    .icon-btn { width:34px; height:34px; border:none; background:transparent; border-radius:8px; cursor:pointer; font-size:15px; color:var(--text2); transition:background .15s; }
    .icon-btn:hover { background:var(--bg); }
    .icon-btn.del:hover { background:#fee2e2; }

    /* List tab */
    .list-toolbar { padding:12px 20px 8px; display:flex; gap:8px; flex-shrink:0; }
    .search-input { flex:1; padding:9px 14px; border:1px solid var(--border); border-radius:8px; font-size:15px; background:var(--card); outline:none; transition:border-color .2s; }
    .search-input:focus { border-color:var(--primary); }
    .word-list { flex:1; padding:0 20px 24px; display:flex; flex-direction:column; gap:8px; }
    .word-count { font-size:13px; color:var(--text2); padding:2px 0 6px; }
    .word-card { background:var(--card); border-radius:var(--r); padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); border:1px solid var(--border); }
    .word-english { font-size:17px; font-weight:600; }
    .word-japanese { font-size:13px; color:var(--text2); margin-top:2px; }
    .word-actions { display:flex; gap:4px; flex-shrink:0; }
    .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text2); padding:40px; text-align:center; }
    .empty-icon { font-size:56px; opacity:.4; }
    .empty-title { font-size:18px; font-weight:600; color:var(--text); }

    /* ── Flashcard tab ── */
    #cardTab { overflow:hidden; }
    #cardInner2 { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    .fc-toolbar { display:flex; align-items:center; gap:10px; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--card); flex-shrink:0; flex-wrap:wrap; }
    .fc-stats { font-size:13px; font-weight:600; color:var(--text2); flex:1; }
    .fc-filters { display:flex; gap:6px; }
    .filt-btn { padding:5px 14px; border:1.5px solid var(--border); border-radius:20px; background:transparent; font-size:13px; font-weight:600; cursor:pointer; color:var(--text2); transition:all .2s; }
    .filt-btn.on { border-color:var(--primary); color:var(--primary); background:rgba(59,130,246,.08); }
    .fc-counter { text-align:center; font-size:13px; color:var(--text2); font-weight:500; padding:8px 0 4px; flex-shrink:0; }
    .card-scene { flex:1; min-height:0; margin:0 20px; perspective:1000px; cursor:pointer; user-select:none; }
    .card-flip { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,0,.2,1); }
    .card-flip.flipped { transform:rotateY(180deg); }
    .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--card); border-radius:16px; border:1px solid var(--border); box-shadow:0 4px 24px rgba(0,0,0,.08); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; }
    .card-back-face { transform:rotateY(180deg); }
    .card-badge { position:absolute; top:14px; right:16px; font-size:18px; }
    .card-eng { font-size:clamp(28px,7vw,56px); font-weight:800; text-align:center; line-height:1.1; }
    .card-hint-txt { font-size:13px; color:var(--text2); margin-top:14px; }
    .card-eng-sm { font-size:clamp(16px,3vw,26px); font-weight:600; color:var(--text2); text-align:center; }
    .card-sep { width:50px; height:2px; background:var(--border); margin:14px 0; }
    .card-jpn { font-size:clamp(22px,5vw,42px); font-weight:700; text-align:center; line-height:1.2; }
    .fc-nav { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; flex-shrink:0; gap:10px; }
    .mark-btns { display:flex; gap:10px; }
    .fc-keys { text-align:center; font-size:11px; color:var(--text2); padding:0 20px 10px; flex-shrink:0; }

    /* Study tab */
    #studyTab { overflow:hidden; }
    #studyInner { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    #noStudy { display:flex; flex-direction:column; flex:1; align-items:center; justify-content:center; gap:12px; color:var(--text2); padding:40px; text-align:center; }
    .study-header { text-align:center; padding:18px 24px 12px; background:var(--card); border-bottom:1px solid var(--border); flex-shrink:0; }
    .word-display { font-size:clamp(34px,9vw,62px); font-weight:800; letter-spacing:-.5px; margin-bottom:10px; }
    .meaning-btn { background:transparent; border:1.5px solid var(--primary); color:var(--primary); padding:6px 18px; border-radius:20px; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; }
    .meaning-btn.shown { background:var(--primary); color:#fff; }
    .progress-area { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 0; flex-shrink:0; }
    .dots { display:flex; gap:12px; }
    .dot { width:14px; height:14px; border-radius:50%; background:var(--border); transition:all .3s; }
    .dot.done { background:var(--primary); } .dot.current { background:rgba(59,130,246,.45); transform:scale(1.3); }
    .attempt-label { font-size:13px; color:var(--text2); font-weight:500; }
    .canvas-wrap { flex:1; min-height:0; margin:0 20px; border-radius:var(--r); overflow:hidden; position:relative; background:#fafafa; border:1px solid var(--border); background-image:repeating-linear-gradient(to bottom,transparent,transparent calc(100%/7 - 1px),rgba(59,130,246,.12) calc(100%/7 - 1px),rgba(59,130,246,.12) calc(100%/7)); touch-action:none; cursor:crosshair; }
    #drawSvg { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; pointer-events:none; }
    .study-btns { display:flex; justify-content:center; gap:16px; padding:14px 20px; flex-shrink:0; }
    .shuffle-btn { background:transparent; border:1.5px solid var(--border); border-radius:8px; padding:5px 12px; font-size:13px; font-weight:600; color:var(--text2); cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .2s; }
    .shuffle-btn.on { border-color:var(--primary); color:var(--primary); background:rgba(59,130,246,.07); }

    /* Modal */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; align-items:center; justify-content:center; padding:20px; }
    .overlay.open { display:flex; }
    .modal { background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.2); animation:mIn .2s ease; }
    @keyframes mIn { from{opacity:0;transform:scale(.95) translateY(-8px)} to{opacity:1;transform:none} }
    .modal-title { font-size:20px; font-weight:700; margin-bottom:20px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:12px; font-weight:700; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
    .field input { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:8px; font-size:16px; outline:none; transition:border-color .2s; }
    .field input:focus { border-color:var(--primary); }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }

    /* Completion overlay */
    #cmpOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; align-items:center; justify-content:center; }
    #cmpOverlay.open { display:flex; }
    .cmp-card { background:#fff; border-radius:24px; padding:40px; text-align:center; max-width:360px; width:90%; box-shadow:0 24px 80px rgba(0,0,0,.25); animation:cIn .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cIn { from{opacity:0;transform:scale(.65)} to{opacity:1;transform:scale(1)} }
    .cmp-star { font-size:72px; display:block; margin-bottom:16px; animation:sBounce .6s cubic-bezier(.34,1.56,.64,1) .15s both; }
    @keyframes sBounce { from{transform:scale(0) rotate(-30deg)} to{transform:scale(1) rotate(0)} }
    .cmp-title { font-size:28px; font-weight:800; margin-bottom:8px; }
    .cmp-word  { font-size:18px; font-weight:600; color:var(--primary); margin-bottom:24px; }
    .cmp-btns  { display:flex; gap:12px; justify-content:center; }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-top">
      <span class="app-title">✏️ 英単語ライター <span style="font-size:10px;opacity:0.4;font-weight:400">v10</span></span>
      <button class="shuffle-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀 <span id="shuffleLabel">シャッフルOFF</span></button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabList"  onclick="switchTab('list')">📋 単語リスト</button>
      <button class="tab-btn"        id="tabCard"  onclick="switchTab('card')">🃏 フラッシュカード</button>
      <button class="tab-btn"        id="tabStudy" onclick="switchTab('study')">✍️ 練習</button>
    </div>
  </header>

  <div id="content">
    <!-- List -->
    <div class="tab-panel active" id="listTab">
      <div class="list-toolbar">
        <input class="search-input" id="searchInput" type="search" placeholder="🔍 単語を検索..." oninput="renderList()">
        <button class="btn btn-outline" onclick="addToeic()" title="TOEIC単語を一括追加">TOEIC追加</button>
        <button class="btn btn-primary" onclick="openModal()">＋ 追加</button>
      </div>
      <div class="word-list" id="wordList"></div>
    </div>

    <!-- Flashcard -->
    <div class="tab-panel" id="cardTab">
      <div id="cardInner2">
        <div class="fc-toolbar">
          <span class="fc-stats" id="fcStats"></span>
          <div class="fc-filters">
            <button class="filt-btn on" id="filtAll"     onclick="setFilt('all')">全て</button>
            <button class="filt-btn"    id="filtUnknown" onclick="setFilt('unknown')">未習得のみ</button>
          </div>
          <button class="icon-btn" onclick="shuffleFC()" title="シャッフル">🔀</button>
          <button class="icon-btn" onclick="resetFC()"   title="リセット">↺</button>
        </div>
        <div class="fc-counter" id="fcCounter"></div>
        <div class="card-scene" id="cardScene" onclick="flipCard()">
          <div class="card-flip" id="cardFlip">
            <div class="card-face">
              <div class="card-badge" id="cardBadge"></div>
              <div class="card-eng"  id="cardEng"></div>
              <div class="card-hint-txt">クリックして意味を確認</div>
            </div>
            <div class="card-face card-back-face">
              <div class="card-eng-sm" id="cardEngB"></div>
              <div class="card-sep"></div>
              <div class="card-jpn"   id="cardJpn"></div>
            </div>
          </div>
        </div>
        <div class="fc-nav">
          <button class="btn btn-outline" onclick="prevCard()">← 前へ</button>
          <div class="mark-btns" id="markBtns" style="display:none">
            <button class="btn btn-red-soft" onclick="markCard('unknown')">✗ 知らなかった</button>
            <button class="btn btn-grn-soft" onclick="markCard('known')">✓ 知ってた</button>
          </div>
          <button class="btn btn-outline" onclick="nextCard()">次へ →</button>
        </div>
        <div class="fc-keys">Space: めくる &nbsp;|&nbsp; K: 知ってた &nbsp;|&nbsp; X: 知らなかった &nbsp;|&nbsp; ←→: ナビ</div>
      </div>
      <div id="fcEmpty" class="empty-state" style="display:none">
        <div class="empty-icon">🎉</div>
        <div class="empty-title">全て習得済み！</div>
        <div>「全て」に切り替えるかリセットしてください</div>
        <button class="btn btn-primary" onclick="setFilt('all')" style="margin-top:12px">全て表示</button>
      </div>
      <div id="fcNoWords" class="empty-state" style="display:none">
        <div class="empty-icon">📚</div>
        <div class="empty-title">単語がありません</div>
        <button class="btn btn-primary" onclick="switchTab('list')" style="margin-top:12px">単語を追加</button>
      </div>
    </div>

    <!-- Study -->
    <div class="tab-panel" id="studyTab">
      <div id="studyInner">
        <div class="study-header">
          <div class="word-display" id="wordDisplay"></div>
          <button class="meaning-btn" id="meaningBtn" onclick="toggleMeaning()">👁 <span id="meaningText">意味を見る</span></button>
        </div>
        <div class="progress-area">
          <div class="dots" id="dots"></div>
          <div class="attempt-label" id="attemptLabel"></div>
        </div>
        <div class="canvas-wrap" id="canvasWrap"><svg id="drawSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div id="dbgBar" style="text-align:center;font-size:12px;color:#888;padding:2px 0;flex-shrink:0;">待機中</div>
        <div class="study-btns">
          <button class="btn btn-orange btn-lg" onclick="clearCanvas()">🗑 消去</button>
          <button class="btn btn-primary btn-lg" id="nextBtn" onclick="nextAttempt()"></button>
        </div>
        <div style="text-align:center;padding:4px 0 8px;flex-shrink:0;">
          <button onclick="runDiag()" style="background:#ef4444;color:white;border:none;border-radius:8px;padding:8px 20px;font-size:14px;font-weight:700;">🔴 診断ボタン（タップ）</button>
        </div>
      </div>
      <div id="noStudy" style="display:none">
        <span style="font-size:56px">📚</span>
        <div style="font-size:18px;font-weight:700;color:var(--text)">単語がありません</div>
        <button class="btn btn-primary" onclick="switchTab('list')" style="margin-top:8px">単語を追加</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="modalOverlay" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">単語を追加</div>
    <div class="field"><label>英単語</label><input id="inEng" type="text" placeholder="例: apple" spellcheck="false" autocapitalize="none" autocomplete="off"></div>
    <div class="field"><label>意味（日本語）</label><input id="inJpn" type="text" placeholder="例: りんご" autocomplete="off"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveWord()">保存</button>
    </div>
  </div>
</div>

<div id="cmpOverlay">
  <div class="cmp-card">
    <span class="cmp-star">⭐</span>
    <div class="cmp-title">5回書けた！</div>
    <div class="cmp-word" id="cmpWord"></div>
    <div class="cmp-btns">
      <button class="btn btn-outline" onclick="restartWord()">🔄 もう一度</button>
      <button class="btn btn-primary btn-lg" onclick="nextWord()">次の単語 →</button>
    </div>
  </div>
</div>

<div id="fixedDbg" style="position:fixed;bottom:0;left:0;right:0;background:#1e293b;color:#fff;font-size:13px;font-weight:bold;text-align:center;padding:6px;z-index:9999;pointer-events:none;">JS起動待ち...</div>
<script>
// 最初に実行 - エラーがあってもここは動く
window.onerror = function(msg,s,l){ document.getElementById('fixedDbg').textContent='JSエラー: '+msg+' L'+l; };
var _dbgMoveCount = 0;
['touchstart','mousedown','pointerdown'].forEach(function(ev) {
  document.addEventListener(ev, function(e) {
    _dbgMoveCount = 0;
    var t = e.changedTouches ? e.changedTouches[0] : e;
    document.getElementById('fixedDbg').textContent = ev+' '+e.pointerType+' on '+e.target.tagName+'#'+e.target.id;
  }, { passive: true });
});
['touchmove','mousemove','pointermove'].forEach(function(ev) {
  document.addEventListener(ev, function(e) {
    if (ev==='mousemove' && e.buttons===0) return;
    _dbgMoveCount++;
    document.getElementById('fixedDbg').textContent = ev+'×'+_dbgMoveCount;
  }, { passive: true });
});
// ━━━ TOEIC 1000語 ━━━

['announce','発表する'],['annual','年次の、年1回の'],['anticipate','予期する'],
['apparent','明らかな'],['apply','申し込む、適用する'],['appoint','任命する'],
['appraise','評価する、査定する'],['approve','承認する'],['approximately','おおよそ'],

['accumulate','蓄積する'],['achieve','達成する'],['activate','活性化する'],

['campaign','キャンペーン'],['candidate','候補者'],['capable','能力のある'],
['capacity','能力、容量、収容力'],['capital','資本、首都'],['cancellation','キャンセル'],
['carrier','運送業者、通信会社'],['category','カテゴリー、分類'],['certify','証明する'],
['challenge','課題、挑戦'],['charge','請求する、担当する'],['claim','請求する、主張する'],

// ━━━ State ━━━
let words = JSON.parse(localStorage.getItem('vocabWords') || '[]');
let fcResults = JSON.parse(localStorage.getItem('fcResults') || '{}');
let editId = null;
let study = { order:[], idx:0, attempt:1, shuffled:false, showMeaning:false };
let fc = { refs:[], order:[], idx:0, flipped:false, filter:'all' };

// ━━━ Boot ━━━
(function init() {
  if (!localStorage.getItem('toeicLoaded')) {
    const existing = new Set(words.map(w => w.eng.toLowerCase()));
    TOEIC_WORDS.forEach(([eng, jpn]) => {
      if (!existing.has(eng.toLowerCase()))
        words.push({ id: Date.now() + Math.random(), eng, jpn });
    });
    localStorage.setItem('toeicLoaded', '1');
    save();
  }
  renderList();
  setupCanvas();
})();

function save() { localStorage.setItem('vocabWords', JSON.stringify(words)); }
function saveFC() { localStorage.setItem('fcResults', JSON.stringify(fcResults)); }

// ━━━ TOEIC一括追加ボタン ━━━
function addToeic() {
  const existing = new Set(words.map(w => w.eng.toLowerCase()));
  let n = 0;
  TOEIC_WORDS.forEach(([eng, jpn]) => {
    if (!existing.has(eng.toLowerCase())) { words.push({ id: Date.now()+Math.random(), eng, jpn }); n++; }
  });
  if (n > 0) { save(); renderList(); alert(n + '語を追加しました'); }
  else alert('全てのTOEIC単語が既に登録されています');
}

// ━━━ Tabs ━━━
function switchTab(tab) {
  ['list','card','study'].forEach(t => {
    const btn = document.getElementById('tab' + t[0].toUpperCase() + t.slice(1));
    if (btn) btn.classList.toggle('active', t === tab);
    document.getElementById(t + 'Tab').classList.toggle('active', t === tab);
  });
  if (tab === 'study') { initStudy(); requestAnimationFrame(() => requestAnimationFrame(resizeCanvas)); }
  if (tab === 'card')  initFC();
}

// ━━━ Word List ━━━
function renderList() {
  const q  = document.getElementById('searchInput').value.toLowerCase();
  const fl = words.filter(w => w.eng.toLowerCase().includes(q) || w.jpn.toLowerCase().includes(q));
  const el = document.getElementById('wordList');
  if (words.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-title">単語リストが空です</div><div>「＋ 追加」または「TOEIC追加」から登録できます</div></div>`;
    return;
  }
  if (fl.length === 0) {
    el.innerHTML = `<div class="word-count">${words.length}語登録済み</div><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">見つかりません</div></div>`;
    return;
  }
  el.innerHTML = `<div class="word-count">${fl.length} / ${words.length}語</div>` +
    fl.map(w => `<div class="word-card"><div style="flex:1"><div class="word-english">${esc(w.eng)}</div><div class="word-japanese">${esc(w.jpn)}</div></div><div class="word-actions"><button class="icon-btn" onclick="openModal(${w.id})">✏️</button><button class="icon-btn del" onclick="deleteWord(${w.id})">🗑️</button></div></div>`).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function deleteWord(id) {
  if (!confirm('この単語を削除しますか？')) return;
  words = words.filter(w => w.id !== id); save(); renderList();
}

// ━━━ Modal ━━━
function openModal(id = null) {
  editId = id;
  const w = id ? words.find(w => w.id === id) : null;
  document.getElementById('modalTitle').textContent = id ? '単語を編集' : '単語を追加';
  document.getElementById('inEng').value = w ? w.eng : '';
  document.getElementById('inJpn').value = w ? w.jpn : '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('inEng').focus(), 80);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editId = null; }
function bgClose(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function saveWord() {
  const eng = document.getElementById('inEng').value.trim();
  const jpn = document.getElementById('inJpn').value.trim();
  if (!eng) { document.getElementById('inEng').focus(); return; }
  if (editId) { const w = words.find(w => w.id === editId); if (w) { w.eng = eng; w.jpn = jpn; } }
  else words.push({ id: Date.now(), eng, jpn });
  save(); renderList(); closeModal();
}
document.getElementById('inEng').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('inJpn').focus(); });
document.getElementById('inJpn').addEventListener('keydown', e => { if (e.key==='Enter') saveWord(); });

// ━━━ Flashcard ━━━
function initFC() {
  const all = document.getElementById('fcNoWords');
  const empty = document.getElementById('fcEmpty');
  const inner = document.getElementById('cardInner2');
  if (words.length === 0) {
    inner.style.display = 'none'; all.style.display = 'flex'; empty.style.display = 'none'; return;
  }
  const base = fc.filter === 'unknown' ? words.filter(w => fcResults[w.eng] !== 'known') : [...words];
  if (base.length === 0) {
    inner.style.display = 'none'; all.style.display = 'none'; empty.style.display = 'flex'; return;
  }
  inner.style.display = 'flex'; all.style.display = 'none'; empty.style.display = 'none';
  fc.refs = base;
  fc.order = base.map((_,i) => i);
  fc.idx = 0; fc.flipped = false;
  renderCard();
}

function renderCard() {
  const w = fc.refs[fc.order[fc.idx]];
  document.getElementById('cardEng').textContent  = w.eng;
  document.getElementById('cardEngB').textContent = w.eng;
  document.getElementById('cardJpn').textContent  = w.jpn;
  document.getElementById('fcCounter').textContent = `${fc.idx + 1} / ${fc.order.length}`;
  const r = fcResults[w.eng];
  document.getElementById('cardBadge').textContent = r === 'known' ? '✓' : r === 'unknown' ? '✗' : '';
  document.getElementById('cardFlip').classList.remove('flipped');
  document.getElementById('markBtns').style.display = 'none';
  fc.flipped = false;
  updateFCStats();
}

function updateFCStats() {
  const known   = words.filter(w => fcResults[w.eng] === 'known').length;
  const unknown = words.filter(w => fcResults[w.eng] === 'unknown').length;
  const unmarked = words.length - known - unknown;
  document.getElementById('fcStats').textContent = `✓ ${known}  ✗ ${unknown}  未 ${unmarked}`;
}

function flipCard() {
  if (fc.flipped) return;
  fc.flipped = true;
  document.getElementById('cardFlip').classList.add('flipped');
  document.getElementById('markBtns').style.display = 'flex';
}

function markCard(result) {
  const w = fc.refs[fc.order[fc.idx]];
  fcResults[w.eng] = result;
  saveFC();
  nextCard();
}

function nextCard() {
  fc.idx = (fc.idx + 1) % fc.order.length;
  renderCard();
}
function prevCard() {
  fc.idx = (fc.idx - 1 + fc.order.length) % fc.order.length;
  renderCard();
}
function shuffleFC() {
  fc.order.sort(() => Math.random() - .5);
  fc.idx = 0; renderCard();
}
function resetFC() {
  if (!confirm('学習記録をリセットしますか？')) return;
  fcResults = {}; saveFC(); initFC();
}
function setFilt(f) {
  fc.filter = f;
  document.getElementById('filtAll').classList.toggle('on', f === 'all');
  document.getElementById('filtUnknown').classList.toggle('on', f === 'unknown');
  initFC();
}

// Keyboard shortcuts for flashcard
document.addEventListener('keydown', e => {
  if (!document.getElementById('cardTab').classList.contains('active')) return;
  if (document.getElementById('modalOverlay').classList.contains('open')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight' || e.key === 'l') nextCard();
  else if (e.key === 'ArrowLeft'  || e.key === 'h') prevCard();
  else if (e.key === 'k' || e.key === 'K') { if (fc.flipped) markCard('known'); }
  else if (e.key === 'x' || e.key === 'X') { if (fc.flipped) markCard('unknown'); }
});

// ━━━ Study ━━━
function initStudy() {
  const has = words.length > 0;
  document.getElementById('studyInner').style.display = has ? 'flex' : 'none';
  document.getElementById('noStudy').style.display    = has ? 'none' : 'flex';
  if (!has) return;
  if (study.order.length !== words.length) resetOrder();
  renderStudy();
}
function resetOrder() {
  study.order = words.map((_,i) => i);
  if (study.shuffled) study.order.sort(() => Math.random() - .5);
  study.idx = 0; study.attempt = 1; study.showMeaning = false;
}
function curWord() { return words[study.order[study.idx % study.order.length]]; }
function renderStudy() {
  const w = curWord(); if (!w) return;
  study.showMeaning = false;
  document.getElementById('wordDisplay').textContent = w.eng;
  updateMeaningBtn(w); renderDots(); updateNextBtn();
}
function updateMeaningBtn(w) {
  const shown = study.showMeaning;
  document.getElementById('meaningText').textContent = shown ? (w && w.jpn ? w.jpn : '—') : '意味を見る';
  document.getElementById('meaningBtn').classList.toggle('shown', shown);
}
function toggleMeaning() { study.showMeaning = !study.showMeaning; updateMeaningBtn(curWord()); }
function renderDots() {
  document.getElementById('dots').innerHTML = Array.from({length:5},(_,i) => {
    const n=i+1; const c = n<study.attempt?'done':n===study.attempt?'current':'';
    return `<div class="dot ${c}"></div>`;
  }).join('');
  document.getElementById('attemptLabel').textContent = `${study.attempt} / 5 回目`;
}
function updateNextBtn() {
  const btn = document.getElementById('nextBtn');
  btn.textContent = study.attempt < 5 ? `次へ (${study.attempt}/5) →` : '完了 ✓';
  btn.className   = 'btn btn-lg ' + (study.attempt < 5 ? 'btn-primary' : 'btn-success');
}
function nextAttempt() {
  if (study.attempt < 5) { study.attempt++; clearCanvas(); renderDots(); updateNextBtn(); }
  else showCompletion();
}
function showCompletion() {
  const w = curWord();
  document.getElementById('cmpWord').textContent = w.eng + (w.jpn ? ' — ' + w.jpn : '');
  document.getElementById('cmpOverlay').classList.add('open');
}
function restartWord() {
  document.getElementById('cmpOverlay').classList.remove('open');
  study.attempt = 1; study.showMeaning = false; clearCanvas(); renderStudy();
}
function nextWord() {
  document.getElementById('cmpOverlay').classList.remove('open');
  study.idx = (study.idx + 1) % words.length;
  study.attempt = 1; study.showMeaning = false; clearCanvas(); renderStudy();
}
function toggleShuffle() {
  study.shuffled = !study.shuffled;
  document.getElementById('shuffleBtn').classList.toggle('on', study.shuffled);
  document.getElementById('shuffleLabel').textContent = study.shuffled ? 'シャッフルON' : 'シャッフルOFF';
  resetOrder();
  if (document.getElementById('studyTab').classList.contains('active')) { renderStudy(); clearCanvas(); }
}

// ━━━ Drawing (SVG) ━━━
let drawSvg, currentPath = null, pathData = '', _touchActive = false;

function setupCanvas() {
  drawSvg = document.getElementById('drawSvg');
  const wrap = document.getElementById('canvasWrap');
  // SVGはレンダリング専用。イベントはHTMLのwrapで受け取る
  drawSvg.style.pointerEvents = 'none';
  wrap.style.touchAction = 'none';

  function dbg(msg) { var el = document.getElementById('dbgBar'); if (el) el.textContent = msg; }

  wrap.addEventListener('touchstart', function(e) {
    e.preventDefault();
    _touchActive = true;
    var t = e.changedTouches[0];
    if (!t) return;
    dbg('touch! x=' + Math.round(t.clientX) + ' y=' + Math.round(t.clientY));
    startStroke(t.clientX, t.clientY);
  }, { passive: false });

  wrap.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    if (!t || !currentPath) return;
    extendStroke(t.clientX, t.clientY);
  }, { passive: false });

  wrap.addEventListener('touchend',    function() { endStroke(); setTimeout(function() { _touchActive = false; }, 50); });
  wrap.addEventListener('touchcancel', function() { endStroke(); setTimeout(function() { _touchActive = false; }, 50); });

  wrap.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'touch') return;
    e.preventDefault();
    dbg('pen! type=' + e.pointerType + ' x=' + Math.round(e.clientX));
    startStroke(e.clientX, e.clientY);
  });
  wrap.addEventListener('pointermove', function(e) {
    if (e.pointerType === 'touch' || !currentPath) return;
    e.preventDefault();
    extendStroke(e.clientX, e.clientY);
  });
  wrap.addEventListener('pointerup',     function(e) { if (e.pointerType !== 'touch') endStroke(); });
  wrap.addEventListener('pointercancel', function(e) { if (e.pointerType !== 'touch') endStroke(); });
}

function runDiag() {
  var svg = document.getElementById('drawSvg');
  var wrap = document.getElementById('canvasWrap');
  var sr = svg ? svg.getBoundingClientRect() : null;
  var wr = wrap ? wrap.getBoundingClientRect() : null;
  var msg = 'SVG: ' + (sr ? Math.round(sr.width) + 'x' + Math.round(sr.height) : 'not found') +
            '\nWrap: ' + (wr ? Math.round(wr.width) + 'x' + Math.round(wr.height) : 'not found');
  // Draw a red test line directly in SVG coordinates
  if (svg) {
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('stroke', 'red');
    line.setAttribute('stroke-width', '6');
    line.setAttribute('fill', 'none');
    line.setAttribute('d', 'M 20 20 L 120 80 L 220 20');
    svg.appendChild(line);
    msg += '\n赤い線が見えますか？';
  }
  alert(msg);
}

function startStroke(clientX, clientY) {
  const r = drawSvg.getBoundingClientRect();
  const x = (clientX - r.left).toFixed(1), y = (clientY - r.top).toFixed(1);
  // タップだけでも見えるように点を描く
  var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', x); dot.setAttribute('cy', y);
  dot.setAttribute('r', '3'); dot.setAttribute('fill', '#1a1a2e');
  drawSvg.appendChild(dot);
  currentPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  currentPath.setAttribute('stroke', '#1a1a2e');
  currentPath.setAttribute('stroke-width', '3');
  currentPath.setAttribute('fill', 'none');
  currentPath.setAttribute('stroke-linecap', 'round');
  currentPath.setAttribute('stroke-linejoin', 'round');
  pathData = 'M ' + x + ' ' + y;
  currentPath.setAttribute('d', pathData);
  drawSvg.appendChild(currentPath);
}

function extendStroke(clientX, clientY) {
  if (!currentPath) return;
  const r = drawSvg.getBoundingClientRect();
  const x = (clientX - r.left).toFixed(1), y = (clientY - r.top).toFixed(1);
  pathData += ' L ' + x + ' ' + y;
  currentPath.setAttribute('d', pathData);
}

function endStroke() { currentPath = null; pathData = ''; }

function clearCanvas() {
  if (!drawSvg) return;
  var children = Array.from(drawSvg.children);
  children.forEach(function(c) { if (c.id !== 'svgBg') drawSvg.removeChild(c); });
}

function resizeCanvas() {}
window.addEventListener('resize', function() {});

</script>
