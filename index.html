<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>英単語ライター</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --primary:#4f46e5; --primary-dk:#3730a3; --primary-lt:#e0e7ff;
      --accent:#7c3aed; --success:#059669; --danger:#ef4444; --orange:#ea580c;
      --bg:#eef0fb; --card:#ffffff; --text:#0f172a; --text2:#64748b;
      --border:#dde5f4; --shadow:0 2px 8px rgba(49,46,129,.08);
      --shadow-lg:0 8px 32px rgba(49,46,129,.14); --r:14px;
      --hdr:linear-gradient(135deg,#4338ca 0%,#7c3aed 100%);
    }
    html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    input,textarea { -webkit-user-select:text; user-select:text; }
    #app { display:flex; flex-direction:column; height:100dvh; }

    /* ─── Header ─── */
    header { background:var(--hdr); border-bottom:none; padding:0 16px; flex-shrink:0; box-shadow:0 4px 20px rgba(67,56,202,.35); }
    .header-top { display:flex; align-items:center; justify-content:space-between; padding:10px 0 6px; gap:8px; }
    .app-title { font-size:20px; font-weight:800; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.2); flex-shrink:0; }
    .header-controls { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .mute-btn { width:34px; height:34px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.15); border-radius:50%; font-size:16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#fff; transition:all .2s; flex-shrink:0; -webkit-user-select:none; }
    .mute-btn.muted { background:rgba(239,68,68,.4); border-color:rgba(239,68,68,.6); }
    .shuffle-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:5px 12px; font-size:13px; font-weight:600; color:rgba(255,255,255,.85); cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .2s; white-space:nowrap; }
    .shuffle-btn.on { background:rgba(255,255,255,.3); border-color:rgba(255,255,255,.55); color:#fff; }
    .tabs { display:flex; gap:2px; }
    .tab-btn { padding:8px 16px; border:none; background:transparent; border-bottom:3px solid transparent; font-size:14px; font-weight:600; color:rgba(255,255,255,.6); cursor:pointer; transition:all .2s; white-space:nowrap; }
    .tab-btn.active { color:#fff; border-bottom-color:rgba(255,255,255,.9); }
    #content { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .tab-panel { display:none; flex:1; min-height:0; flex-direction:column; overflow-y:auto; }
    .tab-panel.active { display:flex; }

    /* ─── Buttons ─── */
    .btn { padding:10px 18px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .15s; white-space:nowrap; }
    .btn:active { transform:scale(.96); }
    .btn-primary { background:linear-gradient(135deg,#4f46e5,#6366f1); color:#fff; box-shadow:0 3px 12px rgba(79,70,229,.45); }
    .btn-success { background:linear-gradient(135deg,#059669,#10b981); color:#fff; box-shadow:0 3px 12px rgba(5,150,105,.4); }
    .btn-orange  { background:linear-gradient(135deg,#ea580c,#f97316); color:#fff; box-shadow:0 3px 12px rgba(234,88,12,.4); }
    .btn-outline { background:rgba(255,255,255,.7); color:var(--text2); border:1.5px solid var(--border); }
    .btn-red-soft { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#b91c1c; border:none; }
    .btn-grn-soft { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#065f46; border:none; }
    .btn-lg { padding:14px 28px; font-size:16px; border-radius:12px; min-width:140px; justify-content:center; }
    .icon-btn { width:34px; height:34px; border:none; background:transparent; border-radius:8px; cursor:pointer; font-size:15px; color:var(--text2); transition:background .15s; }
    .icon-btn:hover { background:var(--bg); }
    .icon-btn.del:hover { background:#fee2e2; }

    /* ─── List tab ─── */
    .list-toolbar { padding:12px 20px 8px; display:flex; gap:8px; flex-shrink:0; }
    .search-input { flex:1; padding:9px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; background:var(--card); outline:none; transition:border-color .2s; box-shadow:var(--shadow); }
    .search-input:focus { border-color:var(--primary); }
    .word-list { flex:1; padding:0 16px 24px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
    .word-count { font-size:13px; color:var(--text2); padding:4px 4px 6px; font-weight:600; }
    .word-card { background:var(--card); border-radius:var(--r); padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); border:1px solid var(--border); transition:transform .15s,box-shadow .15s; }
    .word-card:active { transform:scale(.99); box-shadow:none; }
    .word-english { font-size:17px; font-weight:700; color:var(--text); }
    .word-japanese { font-size:13px; color:var(--text2); margin-top:2px; }
    .word-actions { display:flex; gap:4px; flex-shrink:0; }
    .pos-tag { margin-left:7px; font-size:10px; font-weight:700; color:var(--primary); background:var(--primary-lt); border:1px solid rgba(79,70,229,.2); border-radius:10px; padding:1px 7px; vertical-align:middle; letter-spacing:.02em; }
    .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text2); padding:40px; text-align:center; }
    .empty-icon { font-size:56px; opacity:.35; }
    .empty-title { font-size:18px; font-weight:700; color:var(--text); }

    /* ─── Flashcard ─── */
    #cardTab { overflow:hidden; }
    #cardInner2 { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    .fc-toolbar { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--card); flex-shrink:0; flex-wrap:wrap; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .fc-stats { font-size:13px; font-weight:700; color:var(--text2); flex:1; }
    .fc-filters { display:flex; gap:6px; }
    .filt-btn { padding:5px 14px; border:1.5px solid var(--border); border-radius:20px; background:transparent; font-size:13px; font-weight:700; cursor:pointer; color:var(--text2); transition:all .2s; }
    .filt-btn.on { border-color:var(--primary); color:var(--primary); background:var(--primary-lt); }
    .fc-counter { text-align:center; font-size:13px; color:var(--text2); font-weight:600; padding:8px 0 4px; flex-shrink:0; }
    .card-scene { flex:1; min-height:0; margin:0 16px; perspective:1200px; cursor:pointer; user-select:none; }
    .card-flip { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,0,.2,1); }
    .card-flip.flipped { transform:rotateY(180deg); }
    .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:20px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; background:var(--card); border:1px solid var(--border); }
    .card-face:first-of-type { background:linear-gradient(155deg,#4338ca 0%,#7c3aed 100%); border:none; }
    .card-back-face { transform:rotateY(180deg); }
    .card-badge { position:absolute; top:14px; right:16px; font-size:18px; }
    .card-eng { font-size:clamp(28px,7vw,56px); font-weight:800; text-align:center; line-height:1.1; color:#fff; }
    .card-hint-txt { font-size:13px; color:rgba(255,255,255,.55); margin-top:14px; }
    .card-eng-sm { font-size:clamp(16px,3vw,26px); font-weight:700; color:var(--text2); text-align:center; }
    .card-pos { font-size:12px; font-weight:700; color:var(--primary); background:var(--primary-lt); border-radius:10px; padding:2px 10px; margin-top:5px; }
    .card-sep { width:50px; height:2px; background:var(--border); margin:14px 0; border-radius:1px; }
    .card-jpn { font-size:clamp(22px,5vw,42px); font-weight:800; text-align:center; line-height:1.2; color:var(--text); }
    .fc-nav { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; flex-shrink:0; gap:10px; }
    .mark-btns { display:flex; gap:10px; }
    .fc-keys { text-align:center; font-size:11px; color:var(--text2); padding:0 16px 10px; flex-shrink:0; }

    /* ─── Study tab ─── */
    #studyTab { overflow:hidden; }
    #studyInner { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    #noStudy { display:flex; flex-direction:column; flex:1; align-items:center; justify-content:center; gap:12px; color:var(--text2); padding:40px; text-align:center; }
    .study-header { text-align:center; padding:14px 16px 12px; background:linear-gradient(155deg,#4338ca 0%,#7c3aed 100%); border-bottom:none; flex-shrink:0; box-shadow:0 4px 16px rgba(67,56,202,.3); }
    .word-header-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:4px; }
    .word-header-row .word-display { margin-bottom:0; }
    .word-display { font-size:clamp(32px,8vw,58px); font-weight:800; letter-spacing:-.5px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.25); margin-bottom:4px; }
    .pos-badge { display:inline-block; font-size:11px; font-weight:700; color:rgba(255,255,255,.8); background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); border-radius:20px; padding:2px 10px; margin-bottom:6px; }
    .meaning-big { font-size:clamp(16px,4vw,24px); font-weight:800; color:#e0e7ff; margin:0 0 6px; text-align:center; }
    .example-wrap { background:rgba(0,0,0,.18); border-radius:10px; padding:8px 12px; margin:0 2px; text-align:left; }
    .example-en { font-size:clamp(11px,2.8vw,14px); color:rgba(255,255,255,.9); line-height:1.7; }
    .example-en mark { background:rgba(255,255,255,.28); color:#fff; font-weight:800; border-radius:3px; padding:0 2px; font-style:normal; }
    .example-ja { font-size:clamp(10px,2.5vw,12px); color:rgba(255,255,255,.55); margin-top:3px; font-style:italic; line-height:1.5; }
    .progress-area { display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 6px; flex-shrink:0; }
    .dots { display:flex; gap:14px; }
    .dot { width:12px; height:12px; border-radius:50%; background:var(--border); transition:all .35s; }
    .dot.done { background:linear-gradient(135deg,#4f46e5,#6366f1); box-shadow:0 2px 6px rgba(79,70,229,.4); }
    .dot.current { background:rgba(79,70,229,.45); transform:scale(1.4); box-shadow:0 0 0 4px rgba(79,70,229,.15); }
    .attempt-label { font-size:13px; color:var(--text2); font-weight:600; }
    .canvas-wrap { flex:1; min-height:0; margin:8px 14px; border-radius:var(--r); overflow:hidden; position:relative; background:#fdfcff; border:1.5px solid var(--border); background-image:repeating-linear-gradient(to bottom,transparent,transparent calc(100%/7 - 1px),rgba(79,70,229,.1) calc(100%/7 - 1px),rgba(79,70,229,.1) calc(100%/7)); touch-action:none; cursor:crosshair; box-shadow:var(--shadow-lg); }
    #drawCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .study-btns { display:flex; justify-content:center; gap:14px; padding:8px 16px 12px; flex-shrink:0; }

    /* ─── Speak button ─── */
    .speak-btn { width:38px; height:38px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.18); border-radius:50%; font-size:18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:all .15s; color:#fff; flex-shrink:0; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .speak-btn:active { background:rgba(255,255,255,.35); transform:scale(.88); }

    /* ─── Modal ─── */
    .overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:100; align-items:center; justify-content:center; padding:20px; }
    .overlay.open { display:flex; }
    .modal { background:var(--card); border-radius:20px; padding:28px; width:100%; max-width:420px; box-shadow:0 24px 80px rgba(15,23,42,.3); animation:mIn .2s ease; }
    @keyframes mIn { from{opacity:0;transform:scale(.95) translateY(-8px)} to{opacity:1;transform:none} }
    .modal-title { font-size:20px; font-weight:800; margin-bottom:20px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:12px; font-weight:700; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
    .field input { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:16px; outline:none; transition:border-color .2s; }
    .field input:focus { border-color:var(--primary); }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }

    /* ─── Completion overlay ─── */
    #cmpOverlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.65); z-index:200; align-items:center; justify-content:center; }
    #cmpOverlay.open { display:flex; }
    .cmp-card { background:linear-gradient(155deg,#4338ca 0%,#7c3aed 100%); border-radius:28px; padding:40px 32px 32px; text-align:center; max-width:360px; width:90%; box-shadow:0 32px 80px rgba(67,56,202,.55); animation:cIn .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cIn { from{opacity:0;transform:scale(.6)} to{opacity:1;transform:scale(1)} }
    .cmp-star { font-size:80px; display:block; margin-bottom:12px; animation:sBounce .7s cubic-bezier(.34,1.56,.64,1) .1s both; }
    @keyframes sBounce { from{transform:scale(0) rotate(-30deg)} to{transform:scale(1) rotate(8deg)} }
    .cmp-title { font-size:26px; font-weight:800; margin-bottom:6px; color:#fff; }
    .cmp-word  { font-size:17px; font-weight:700; color:#c7d2fe; margin-bottom:20px; }
    .cmp-btns  { display:flex; gap:10px; justify-content:center; }
    .cmp-btn-ghost { padding:12px 20px; border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#fff; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
    .cmp-btn-main  { padding:12px 24px; background:rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.4); color:#fff; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
    .cmp-next-label { font-size:12px; color:rgba(255,255,255,.45); margin-top:14px; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-top">
      <span class="app-title">✏️ 英単語ライター</span>
      <div class="header-controls">
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()" title="ミュート">🔊</button>
        <button class="shuffle-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀 <span id="shuffleLabel">シャッフルOFF</span></button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabList"  onclick="switchTab('list')">📋 単語リスト</button>
      <button class="tab-btn"        id="tabCard"  onclick="switchTab('card')">🃏 フラッシュカード</button>
      <button class="tab-btn"        id="tabStudy" onclick="switchTab('study')">✍️ 練習</button>
    </div>
  </header>

  <div id="content">
    <!-- List -->
    <div class="tab-panel active" id="listTab">
      <div class="list-toolbar">
        <input class="search-input" id="searchInput" type="search" placeholder="🔍 単語を検索..." oninput="renderList()">
        <button class="btn btn-outline" onclick="addToeic()" title="TOEIC単語を一括追加">TOEIC追加</button>
        <button class="btn btn-primary" onclick="openModal()">＋ 追加</button>
      </div>
      <div class="word-list" id="wordList"></div>
    </div>

    <!-- Flashcard -->
    <div class="tab-panel" id="cardTab">
      <div id="cardInner2">
        <div class="fc-toolbar">
          <span class="fc-stats" id="fcStats"></span>
          <div class="fc-filters">
            <button class="filt-btn on" id="filtAll"     onclick="setFilt('all')">全て</button>
            <button class="filt-btn"    id="filtUnknown" onclick="setFilt('unknown')">未習得のみ</button>
          </div>
          <button class="icon-btn" onclick="shuffleFC()" title="シャッフル">🔀</button>
          <button class="icon-btn" onclick="resetFC()"   title="リセット">↺</button>
        </div>
        <div class="fc-counter" id="fcCounter"></div>
        <div class="card-scene" id="cardScene" onclick="flipCard()">
          <div class="card-flip" id="cardFlip">
            <div class="card-face">
              <div class="card-badge" id="cardBadge"></div>
              <div class="card-eng"  id="cardEng"></div>
              <div class="card-hint-txt">タップして意味を確認</div>
              <button class="speak-btn" style="position:absolute;bottom:16px;right:16px" onclick="event.stopPropagation();speakFC()" title="発音を聞く">🔊</button>
            </div>
            <div class="card-face card-back-face">
              <div class="card-eng-sm" id="cardEngB"></div>
              <div class="card-pos"    id="cardPos"></div>
              <div class="card-sep"></div>
              <div class="card-jpn"   id="cardJpn"></div>
            </div>
          </div>
        </div>
        <div class="fc-nav">
          <button class="btn btn-outline" onclick="prevCard()">← 前へ</button>
          <div class="mark-btns" id="markBtns" style="display:none">
            <button class="btn btn-red-soft" onclick="markCard('unknown')">✗ 知らなかった</button>
            <button class="btn btn-grn-soft" onclick="markCard('known')">✓ 知ってた</button>
          </div>
          <button class="btn btn-outline" onclick="nextCard()">次へ →</button>
        </div>
        <div class="fc-keys">Space: めくる &nbsp;|&nbsp; K: 知ってた &nbsp;|&nbsp; X: 知らなかった &nbsp;|&nbsp; ←→: ナビ</div>
      </div>
      <div id="fcEmpty" class="empty-state" style="display:none">
        <div class="empty-icon">🎉</div>
        <div class="empty-title">全て習得済み！</div>
        <div>「全て」に切り替えるかリセットしてください</div>
        <button class="btn btn-primary" onclick="setFilt('all')" style="margin-top:12px">全て表示</button>
      </div>
      <div id="fcNoWords" class="empty-state" style="display:none">
        <div class="empty-icon">📚</div>
        <div class="empty-title">単語がありません</div>
        <button class="btn btn-primary" onclick="switchTab('list')" style="margin-top:12px">単語を追加</button>
      </div>
    </div>

    <!-- Study -->
    <div class="tab-panel" id="studyTab">
      <div id="studyInner">
        <div class="study-header">
          <div class="word-header-row">
            <div class="word-display" id="wordDisplay"></div>
            <button class="speak-btn" onclick="speakCurrent()" title="発音を聞く">🔊</button>
          </div>
          <div class="pos-badge" id="posBadge" style="display:none"></div>
          <div class="meaning-big" id="meaningBig"></div>
          <div class="example-wrap">
            <div class="example-en" id="exampleArea"></div>
            <div class="example-ja" id="exampleJa"></div>
          </div>
        </div>
        <div class="progress-area">
          <div class="dots" id="dots"></div>
          <div class="attempt-label" id="attemptLabel"></div>
        </div>
        <div class="canvas-wrap" id="canvasWrap"><canvas id="drawCanvas"></canvas></div>
        <div class="study-btns">
          <button class="btn btn-orange btn-lg" onclick="clearCanvas()">🗑 消去</button>
          <button class="btn btn-primary btn-lg" id="nextBtn" onclick="nextAttempt()"></button>
        </div>
      </div>
      <div id="noStudy" style="display:none">
        <span style="font-size:56px">📚</span>
        <div style="font-size:18px;font-weight:700;color:var(--text)">単語がありません</div>
        <button class="btn btn-primary" onclick="switchTab('list')" style="margin-top:8px">単語を追加</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="modalOverlay" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">単語を追加</div>
    <div class="field"><label>英単語</label><input id="inEng" type="text" placeholder="例: apple" spellcheck="false" autocapitalize="none" autocomplete="off"></div>
    <div class="field"><label>意味（日本語）</label><input id="inJpn" type="text" placeholder="例: りんご" autocomplete="off"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveWord()">保存</button>
    </div>
  </div>
</div>

<div id="cmpOverlay">
  <div class="cmp-card">
    <span class="cmp-star">⭐</span>
    <div class="cmp-title">5回書けた！</div>
    <div class="cmp-word" id="cmpWord"></div>
    <div class="cmp-btns">
      <button class="cmp-btn-ghost" onclick="restartWord()">🔄 もう一度</button>
      <button class="cmp-btn-main"  onclick="nextWord()">次の単語 →</button>
    </div>
    <div class="cmp-next-label">1.5秒後に自動で次へ…</div>
  </div>
</div>

<script>
// ━━━ TOEIC 1000語 ━━━

function getPos(eng) { return POS_MAP[eng.toLowerCase()] || ''; }
function posLabel(pos) {
  return {v:'動詞',n:'名詞',adj:'形容詞',adv:'副詞',prep:'前置詞',ph:'熟語'}[pos] || '';
}
function getRandomExample(eng, pos, jpn) {
  var key = eng.toLowerCase();
  if (EXAMPLES[key] && EXAMPLES[key].length) {
    var arr = EXAMPLES[key];
    return arr[Math.floor(Math.random() * arr.length)];
  }
  var t = EXAMPLE_TEMPLATES[pos] || EXAMPLE_TEMPLATES.n;
  var tmpl = t[Math.floor(Math.random() * t.length)];
  var j1 = jpn ? jpn.split(/[・\/、]/)[0].trim() : eng;
  return {
    en: tmpl.en.replace(/\{w\}/g, eng),
    ja: tmpl.ja.replace(/\{j\}/g, j1),
  };
}
function highlightWord(sentence, word) {
  if (!sentence || !word) return esc(sentence);
  var s = esc(sentence);
  var re = new RegExp('('+word.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+')','gi');
  return s.replace(re,'<mark>$1</mark>');
}

let words = JSON.parse(localStorage.getItem('vocabWords') || '[]');
let fcResults = JSON.parse(localStorage.getItem('fcResults') || '{}');

let study = { order:[], idx:0, attempt:1, shuffled:false };
let fc = { refs:[], order:[], idx:0, flipped:false, filter:'all' };

// ━━━ Boot ━━━
(function init() {
  if (!localStorage.getItem('toeicLoaded_v2')) {
    const existing = new Set(words.map(w => w.eng.toLowerCase()));
    TOEIC_WORDS.forEach(([eng, jpn]) => {
      if (!existing.has(eng.toLowerCase()))
        words.push({ id: Date.now() + Math.random(), eng, jpn });
    });
    localStorage.setItem('toeicLoaded_v2', '1');
    save();
  }
  renderList();
  setupCanvas();
})();

function save() { localStorage.setItem('vocabWords', JSON.stringify(words)); }
function saveFC() { localStorage.setItem('fcResults', JSON.stringify(fcResults)); }

// ━━━ TOEIC一括追加ボタン ━━━
function addToeic() {
  const existing = new Set(words.map(w => w.eng.toLowerCase()));
  let n = 0;
  TOEIC_WORDS.forEach(([eng, jpn]) => {
    if (!existing.has(eng.toLowerCase())) { words.push({ id: Date.now()+Math.random(), eng, jpn }); n++; }
  });
  if (n > 0) { save(); renderList(); alert(n + '語を追加しました'); }
  else alert('全てのTOEIC単語が既に登録されています');
}

// ━━━ Tabs ━━━
function switchTab(tab) {
  ['list','card','study'].forEach(t => {
    const btn = document.getElementById('tab' + t[0].toUpperCase() + t.slice(1));
    if (btn) btn.classList.toggle('active', t === tab);
    document.getElementById(t + 'Tab').classList.toggle('active', t === tab);
  });
  if (tab === 'study') { initStudy(); requestAnimationFrame(() => requestAnimationFrame(initCtx)); }
  if (tab === 'card')  initFC();
}

// ━━━ Word List ━━━
function renderList() {
  const q  = document.getElementById('searchInput').value.toLowerCase();
  const fl = words.filter(w => w.eng.toLowerCase().includes(q) || w.jpn.toLowerCase().includes(q));
  const el = document.getElementById('wordList');
  if (words.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-title">単語リストが空です</div><div>「＋ 追加」または「TOEIC追加」から登録できます</div></div>`;
    return;
  }
  if (fl.length === 0) {
    el.innerHTML = `<div class="word-count">${words.length}語登録済み</div><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">見つかりません</div></div>`;
    return;
  }
  el.innerHTML = `<div class="word-count">${fl.length} / ${words.length}語</div>` +
    fl.map(w => { const pl=posLabel(getPos(w.eng)); return `<div class="word-card"><div style="flex:1"><div class="word-english">${esc(w.eng)}${pl?`<span class="pos-tag">${pl}</span>`:''}</div><div class="word-japanese">${esc(w.jpn)}</div></div><div class="word-actions"><button class="icon-btn" onclick="speakWord(this.dataset.word)" data-word="${esc(w.eng)}" title="発音">🔊</button><button class="icon-btn" onclick="openModal(${w.id})">✏️</button><button class="icon-btn del" onclick="deleteWord(${w.id})">🗑️</button></div></div>`; }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function deleteWord(id) {
  if (!confirm('この単語を削除しますか？')) return;
  words = words.filter(w => w.id !== id); save(); renderList();
}

// ━━━ Modal ━━━
function openModal(id = null) {
  editId = id;
  const w = id ? words.find(w => w.id === id) : null;
  document.getElementById('modalTitle').textContent = id ? '単語を編集' : '単語を追加';
  document.getElementById('inEng').value = w ? w.eng : '';
  document.getElementById('inJpn').value = w ? w.jpn : '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('inEng').focus(), 80);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editId = null; }
function bgClose(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function saveWord() {
  const eng = document.getElementById('inEng').value.trim();
  const jpn = document.getElementById('inJpn').value.trim();
  if (!eng) { document.getElementById('inEng').focus(); return; }
  if (editId) { const w = words.find(w => w.id === editId); if (w) { w.eng = eng; w.jpn = jpn; } }
  else words.push({ id: Date.now(), eng, jpn });
  save(); renderList(); closeModal();
}
document.getElementById('inEng').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('inJpn').focus(); });
document.getElementById('inJpn').addEventListener('keydown', e => { if (e.key==='Enter') saveWord(); });

// ━━━ Flashcard ━━━
function initFC() {
  const all = document.getElementById('fcNoWords');
  const empty = document.getElementById('fcEmpty');
  const inner = document.getElementById('cardInner2');
  if (words.length === 0) {
    inner.style.display = 'none'; all.style.display = 'flex'; empty.style.display = 'none'; return;
  }
  const base = fc.filter === 'unknown' ? words.filter(w => fcResults[w.eng] !== 'known') : [...words];
  if (base.length === 0) {
    inner.style.display = 'none'; all.style.display = 'none'; empty.style.display = 'flex'; return;
  }
  inner.style.display = 'flex'; all.style.display = 'none'; empty.style.display = 'none';
  fc.refs = base;
  fc.order = base.map((_,i) => i);
  fc.idx = 0; fc.flipped = false;
  renderCard();
}

function renderCard() {
  const w = fc.refs[fc.order[fc.idx]];
  document.getElementById('cardEng').textContent  = w.eng;
  document.getElementById('cardEngB').textContent = w.eng;
  document.getElementById('cardJpn').textContent  = w.jpn;
  document.getElementById('cardPos').textContent  = posLabel(getPos(w.eng));
  document.getElementById('fcCounter').textContent = `${fc.idx + 1} / ${fc.order.length}`;
  const r = fcResults[w.eng];
  document.getElementById('cardBadge').textContent = r === 'known' ? '✓' : r === 'unknown' ? '✗' : '';
  document.getElementById('cardFlip').classList.remove('flipped');
  document.getElementById('markBtns').style.display = 'none';
  fc.flipped = false;
  updateFCStats();
}

function updateFCStats() {
  const known   = words.filter(w => fcResults[w.eng] === 'known').length;
  const unknown = words.filter(w => fcResults[w.eng] === 'unknown').length;
  const unmarked = words.length - known - unknown;
  document.getElementById('fcStats').textContent = `✓ ${known}  ✗ ${unknown}  未 ${unmarked}`;
}

function flipCard() {
  if (fc.flipped) return;
  fc.flipped = true;
  document.getElementById('cardFlip').classList.add('flipped');
  document.getElementById('markBtns').style.display = 'flex';
  setTimeout(speakFC, 320);
}

function markCard(result) {
  const w = fc.refs[fc.order[fc.idx]];
  fcResults[w.eng] = result;
  saveFC();
  nextCard();
}

function nextCard() {
  fc.idx = (fc.idx + 1) % fc.order.length;
  renderCard();
}
function prevCard() {
  fc.idx = (fc.idx - 1 + fc.order.length) % fc.order.length;
  renderCard();
}
function shuffleFC() {
  fc.order.sort(() => Math.random() - .5);
  fc.idx = 0; renderCard();
}
function resetFC() {
  if (!confirm('学習記録をリセットしますか？')) return;
  fcResults = {}; saveFC(); initFC();
}
function setFilt(f) {
  fc.filter = f;
  document.getElementById('filtAll').classList.toggle('on', f === 'all');
  document.getElementById('filtUnknown').classList.toggle('on', f === 'unknown');
  initFC();
}

// Keyboard shortcuts for flashcard
document.addEventListener('keydown', e => {
  if (!document.getElementById('cardTab').classList.contains('active')) return;
  if (document.getElementById('modalOverlay').classList.contains('open')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight' || e.key === 'l') nextCard();
  else if (e.key === 'ArrowLeft'  || e.key === 'h') prevCard();
  else if (e.key === 'k' || e.key === 'K') { if (fc.flipped) markCard('known'); }
  else if (e.key === 'x' || e.key === 'X') { if (fc.flipped) markCard('unknown'); }
});

// ━━━ Study ━━━
function initStudy() {
  const has = words.length > 0;
  document.getElementById('studyInner').style.display = has ? 'flex' : 'none';
  document.getElementById('noStudy').style.display    = has ? 'none' : 'flex';
  if (!has) return;
  if (study.order.length !== words.length) resetOrder();
  renderStudy();
}
function resetOrder() {
  study.order = words.map((_,i) => i);
  if (study.shuffled) study.order.sort(() => Math.random() - .5);
  study.idx = 0; study.attempt = 1;
}
function curWord() { return words[study.order[study.idx % study.order.length]]; }
function renderStudy() {
  const w = curWord(); if (!w) return;
  document.getElementById('wordDisplay').textContent = w.eng;
  // POS badge
  const pos = getPos(w.eng);
  const pl  = posLabel(pos);
  const badge = document.getElementById('posBadge');
  badge.textContent = pl; badge.style.display = pl ? 'inline-block' : 'none';

  document.getElementById('meaningBig').textContent = w.jpn;

function renderDots() {

  if (_cmpTimer) { clearTimeout(_cmpTimer); _cmpTimer = null; }

function nextWord() {
  if (_cmpTimer) { clearTimeout(_cmpTimer); _cmpTimer = null; }

  study.shuffled = !study.shuffled;

// ━━━ Pronunciation ━━━
var _muted = false;
var _voice  = null;

(function initVoice() {
  if (!window.speechSynthesis) return;
  function pickVoice() {
    var voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    var prefer = ['Samantha','Karen','Moira','Fiona','Daniel','Alex',
                  'Google US English','Microsoft Aria','Microsoft Zira'];
    for (var p = 0; p < prefer.length; p++) {
      for (var v = 0; v < voices.length; v++) {
        if (voices[v].name.indexOf(prefer[p]) !== -1 && /^en/.test(voices[v].lang)) {
          _voice = voices[v]; return;
        }
      }
    }
    for (var v = 0; v < voices.length; v++) {
      if (voices[v].lang === 'en-US') { _voice = voices[v]; return; }
    }
  }
  pickVoice();
  window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
})();

function speakWord(word) {
  if (_muted || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(word);
  utter.lang  = 'en-US';
  utter.rate  = 0.82;
  utter.pitch = 1.0;
  if (_voice) utter.voice = _voice;
  window.speechSynthesis.speak(utter);
}
function toggleMute() {
  _muted = !_muted;
  var btn = document.getElementById('muteBtn');
  btn.textContent = _muted ? '🔇' : '🔊';
  btn.classList.toggle('muted', _muted);
  if (_muted && window.speechSynthesis) window.speechSynthesis.cancel();
}
function speakCurrent() {
  var w = curWord();
  if (w) speakWord(w.eng);
}
function speakFC() {
  if (!fc.refs.length) return;
  var w = fc.refs[fc.order[fc.idx]];
  if (w) speakWord(w.eng);
}

// ━━━ Canvas Drawing ━━━
var canvas, ctx, drawing = false, lastX = 0, lastY = 0;

function initCtx() {
  if (!canvas) canvas = document.getElementById('drawCanvas');
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.offsetWidth, h = wrap.offsetHeight;
  if (!w || !h) return false;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#1a1a2e'; ctx.fillStyle = '#1a1a2e';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  return true;
}

function penDown(clientX, clientY) {
  if (!ctx) initCtx();
  if (!ctx) return;
  const r = document.getElementById('canvasWrap').getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;
  drawing = true; lastX = x; lastY = y;
  ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
}

function penMove(clientX, clientY) {
  if (!drawing || !ctx) return;
  const r = document.getElementById('canvasWrap').getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;
  ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
  lastX = x; lastY = y;
}

var _autoAdvTimer = null;
function penUp() {
  drawing = false;
  if (!document.getElementById('studyTab').classList.contains('active')) return;
  if (_autoAdvTimer) clearTimeout(_autoAdvTimer);
  _autoAdvTimer = setTimeout(function() {
    _autoAdvTimer = null;
    nextAttempt();
  }, 1200);
}

function setupCanvas() {
  canvas = document.getElementById('drawCanvas');
  const wrap = document.getElementById('canvasWrap');

  wrap.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.changedTouches[0]; if (!t) return;
    penDown(t.clientX, t.clientY);
  }, { passive: false });
  wrap.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.changedTouches[0]; if (!t) return;
    penMove(t.clientX, t.clientY);
  }, { passive: false });
  wrap.addEventListener('touchend',    penUp);
  wrap.addEventListener('touchcancel', penUp);

  wrap.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'touch') return;
    e.preventDefault(); penDown(e.clientX, e.clientY);
  });
  wrap.addEventListener('pointermove', function(e) {
    if (e.pointerType === 'touch') return;
    e.preventDefault(); penMove(e.clientX, e.clientY);
  });
  wrap.addEventListener('pointerup',     function(e) { if (e.pointerType !== 'touch') penUp(); });
  wrap.addEventListener('pointercancel', function(e) { if (e.pointerType !== 'touch') penUp(); });
}

function clearCanvas() {
  if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function resizeCanvas() {
  if (!canvas || !ctx) return;
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.offsetWidth, h = wrap.offsetHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#1a1a2e'; ctx.fillStyle = '#1a1a2e';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.putImageData(img, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

</script>
